<!DOCTYPE html>
<html>
<head>
    <title>Get Firebase Token</title>
</head>
<body>
    <h1>Firebase Authentication Test</h1>
    <input type="email" id="email" placeholder="Email" value="user004@gmail.com">
    <input type="password" id="password" placeholder="Password" value="password123">
    <button onclick="login()">Login & Get Token</button>
    
    <h3>Your Token:</h3>
    <textarea id="token" rows="10" cols="80" readonly></textarea>
    <button onclick="copyToken()">Copy Token</button>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCFR_KPo2bSfOi0Lf11k-YW6yqueNvE4Mw",
            authDomain: "betterment-64363.firebaseapp.com",
            projectId: "betterment-64363",
            storageBucket: "betterment-64363.firebasestorage.app",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const token = await userCredential.user.getIdToken();
                
                document.getElementById('token').value = token;
                console.log('Token:', token);
                alert('Login successful! Token copied to textarea');
            } catch (error) {
                alert('Error: ' + error.message);
                console.error(error);
            }
        };

        window.copyToken = function() {
            const tokenField = document.getElementById('token');
            tokenField.select();
            document.execCommand('copy');
            alert('Token copied to clipboard!');
        };
    </script>
</body>
</html>
